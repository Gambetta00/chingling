<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        #cabecalho {
            background-color: #0b2f6b;
            color: white;
            font-family: sans-serif;
            font-size: 11px;           
            font-weight: bold;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-direction: column;
        }
        #barra-principal {
            background-color: #ffffff;
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e0e0e0;
        }
        .busca {
            display: flex;
            align-items: center;
            background-color: #f2f2f2;
            border-radius: 20px;
            padding: 8px 15px;
            width: 40%;
        }

        .menu {
            display: flex;
            justify-content: space-around;
            gap: 30px;
        }
        .cep {
    font-size: 12px;
    color: #0b2f6b;
    font-weight: bold;
    cursor: pointer;
    white-space: nowrap; /* Impede a quebra de linha ou corte */
    
}
    </style>
</head>
<body>

    <div id="cabecalho">
        <div class="menu">
        <div class="topo-esquerda"></div>
            <div>🚚 Entrega para todo o Brasil</div>
            <div>|</div>
            <div>✔️ Compra segura</div>
            <div>|</div>
            <div>⭐ Qualidade e conforto para o seu lar</div>
            </div>
            <div>
                👤 Minha conta | 🛒 Carrinho 0
            </div>
        </div>
    <div id="barra-principal">
        <div class="logo">
            🏠 Chingling
            <span>Moveis para todos os momentos</span>
        </div>
        <div class="busca">
            <input type="text" placeholder="Olá, o que você procura hoje?">
            <button>🔍</button>
        </div>
        <div class="cep">
            📍 Informe seu CEP
        </div>
        <nav id="menu-categorias">
    <button type="button">Sala de Estar</button>
    <button type="button">Quarto</button>
    <button type="button">Sala de Jantar</button>
    <button type="button">Cozinha</button>
    <button type="button">Escritório</button>
    <button type="button">Banheiro</button>
    <button type="button">Multiuso</button>
    <button type="button">Decoração</button>
    <button type="button">Outlet</button>
    <button type="button">Projetos e ambientes ▾</button>
    <button type="button">Ver mais ▾</button>
</nav>
</body>
</html>
